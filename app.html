<body class="simple-mode">

  <div class="container">

      <div class="tab-panel" id="about-panel">

          <h3>🌐 备份线路域名</h3>

          </p>

            <div class="loading">⏳ 正在加载贡献者...</div>
          </div>

    <!-- ====== 页脚（快捷图标 + 版权小字） ====== -->

  <!-- 电子邮件联系弹窗（type: email 的快捷项共用） -->
  <div class="mail-modal" id="mailModal" aria-hidden="true">
    <div class="mail-modal-mask" data-close></div>

      <div class="mail-modal-title">

        <span>电子邮件联系</span>
      </div>

      <div class="mail-actions">
        <button class="mail-btn mail-btn-primary" type="button" id="mailOpenBtn">打开邮件客户端</button>
        <button class="mail-btn" type="button" id="mailCopyBtn">复制邮箱地址</button>
      </div>
      <p class="mail-modal-tip">接口失效、内容申诉或合作事宜，欢迎来信。</p>
    </div>

  <script>
    const MODE_KEY = 'site_mode';
    const TAB_KEY  = 'current_tab';

    const btn = document.getElementById('modeToggleBtn');
    const searchBox = document.getElementById('search');
    const mainCard = document.querySelector('.main-card');
    const navTabs = document.getElementById('navTabs');
    const headerLogo = document.getElementById('header-logo');
    const headerTitle = document.getElementById('header-title');
    const headerSubtitle = document.getElementById('header-subtitle');
    const footerText = document.getElementById('footer-text');

    let SITE_CONFIG = null;
    let VALID_TABS = [];
    let TABS = [];
    let API_DOMAINS = [];
    let LIVE_DOMAINS = [];
    let API_WEIGHTS = {};
    let ROTATE_KEYWORDS = [];
    let ROTATE_CFG = { keywords: [], seed: 'time-random', randomRange: 10000 };
    let RECENT_DAYS = 2;
    let SEARCH_CFG = { placeholder: '🔍 搜索...', hideOnTabs: [], searchableTabs: [], searchableTabsFull: [], selectors: {} };
    let CUSTOM_APIS = [];

    let currentMode = localStorage.getItem(MODE_KEY) || 'simple';
    let currentTabId = 'api';
    let topSeed = Date.now();
    let rawListText = null;
    let rawLiveText = null;
    let DOWNLOAD_SOURCES = [];

    document.body.className = currentMode + '-mode';
    updateBtnText();

    function isImageIcon(icon) {
      if (!icon || typeof icon !== 'string') return false;
      const s = icon.trim();
      if (!s) return false;
      if (/^(https?:)?\/\//i.test(s)) return true;
      if (/^(\.{1,2}\/|\/)/.test(s)) return true;
      if (/^data:image\//i.test(s)) return true;
      if (/\.(png|jpe?g|gif|webp|svg|ico|bmp|avif)(\?.*)?$/i.test(s)) return true;
      return false;
    }

    function renderIcon(icon, opts) {
      opts = opts || {};
      const size   = opts.size || '1.1rem';
      const box    = opts.box || '1.4rem';
      const fallback = opts.fallback || '📌';
      const cls    = opts.cls || '';

      const val = (icon && String(icon).trim()) ? icon : fallback;

      if (isImageIcon(val)) {
        const url = String(val).trim();
        return `<span class="icon-box ${cls}" style="width:${box};height:${box}">
          <img src="${url}" alt="" loading="lazy"
            onerror="this.style.display='none';this.parentNode.innerHTML='<span style=&quot;font-size:${size}&quot;>${fallback}</span>';">
        </span>`;
      } else {
        return `<span class="icon-box ${cls}" style="font-size:${size}">${val}</span>`;
      }
    }

    const QUICK_ICON_FILE_MAP = {
      qq:       'vip/icon-qq.svg',
      wechat:   'vip/icon-wechat.svg',
      telegram: 'vip/icon-telegram.svg',
      tg:       'vip/icon-telegram.svg',
      github:   'vip/icon-github.svg'
    };

    function buildQuickIcon(icon, color) {
      const val = String(icon || '').trim();
      const c = color || '#4a9eff';

      if (!val) return `<span class="quick-icon quick-icon-text" style="color:${c}">🔗</span>`;
      if (isImageIcon(val)) return `<img class="quick-icon" src="${val}" alt="" loading="lazy">`;
      const key = val.toLowerCase();
      if (QUICK_ICON_FILE_MAP[key]) return `<img class="quick-icon" src="${QUICK_ICON_FILE_MAP[key]}" alt="" loading="lazy">`;
      return `<span class="quick-icon quick-icon-text" style="color:${c}">${val}</span>`;
    }

    let QUICK_LINKS = [];

    /* 联系邮箱统一取自 config.json → site.email */
    function getContactEmail() {
      const site = (SITE_CONFIG && SITE_CONFIG.site) || {};
      return String(site.email || '').trim();
    }

    /* 兼容旧版 config.json：历史第二项是赞赏码快捷项（vip/wc.svg + type:modal），
       配置未同步更新时就地转为「邮件联系」，确保页底不残留旧图标与旧文案 */
    function normalizeQuickLinks(list) {
      const arr = Array.isArray(list) ? list : [];
      return arr.map(function (item) {
        if (!item || typeof item !== 'object') return item;
        if (item.type === 'email') return item;

        const icon = String(item.icon || '').toLowerCase();
        const label = String(item.label || '');
        const title = String(item.title || '');
        const wechatIcon = /(^|\/)(wc|wechat|weixin)\.(svg|png|jpe?g|webp)$/.test(icon)
          || icon.indexOf('wechat') > -1 || icon.indexOf('weixin') > -1;
        const wechatText = /微信\s*赞赏|赞赏码|打赏/.test(label) || title.indexOf('赞赏') > -1;

        if (wechatIcon || wechatText) {
          return { icon: 'vip/email.svg', label: '邮件联系', type: 'email', title: '电子邮件联系' };
        }
        return item;
      });
    }

    function renderQuickLinks(list) {
      const box = document.getElementById('about-quick-links');
      if (!box) return;
      QUICK_LINKS = normalizeQuickLinks(list);

      if (!QUICK_LINKS.length) { box.innerHTML = ''; box.style.display = 'none'; return; }
      box.style.display = '';

      const contactEmail = getContactEmail();

      box.innerHTML = QUICK_LINKS.map(item => {
        const label = item.label || '';
        const iconHtml = buildQuickIcon(item.icon, item.color);

        /* 邮件联系：地址取自 config.json → site.email，点击弹出邮件卡片 */
        if (item.type === 'email') {
          const mail = contactEmail || String(item.email || '').trim();
          if (!mail) {
            return `<a class="quick-item" href="#" data-no-email="1" aria-label="${label}">${iconHtml}<span class="quick-label">${label}</span></a>`;
          }
          return `<button class="quick-item" type="button" data-ql-email="1" aria-label="${label}">${iconHtml}<span class="quick-label">${label}</span></button>`;
        }

        return `<a class="quick-item" href="${item.url || '#'}" target="_blank" rel="noopener noreferrer" aria-label="${label}">${iconHtml}<span class="quick-label">${label}</span></a>`;
      }).join('');

      box.querySelectorAll('[data-ql-email]').forEach(b => {
        b.addEventListener('click', openMailModal);
      });

      box.querySelectorAll('[data-no-email]').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault();
          alert('站长尚未配置联系邮箱，请稍后再试。');
        });
      });
    }

    /* ---------- 电子邮件联系弹窗 ---------- */
    function openMailModal() {
      const modal = document.getElementById('mailModal');
      const addr = document.getElementById('mailAddress');
      if (!modal || !addr) return;

      const mail = getContactEmail();
      if (!mail) {
        alert('站长尚未配置联系邮箱，请稍后再试。');
        return;
      }
      addr.textContent = mail;

      const copyBtn = document.getElementById('mailCopyBtn');
      if (copyBtn) copyBtn.textContent = '复制邮箱地址';

      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      const closeBtn = modal.querySelector('.mail-modal-close');
      if (closeBtn) closeBtn.focus();
    }

    function closeMailModal() {
      const modal = document.getElementById('mailModal');
      if (!modal) return;
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function copyText(text, onDone) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onDone).catch(() => fallbackCopy(text, onDone));
      } else {
        fallbackCopy(text, onDone);
      }
    }

    function fallbackCopy(text, onDone) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); onDone(); } catch (e) {}
      document.body.removeChild(ta);
    }

    (function initMailModal() {
      const modal = document.getElementById('mailModal');
      if (!modal) return;

      modal.addEventListener('click', function (e) {
        if (e.target.hasAttribute('data-close')) closeMailModal();
      });

      document.addEventListener('keydown', function (e) {
        if ((e.key === 'Escape' || e.keyCode === 27) && modal.classList.contains('open')) closeMailModal();
      });

      const openBtn = document.getElementById('mailOpenBtn');
      if (openBtn) openBtn.addEventListener('click', function () {
        const mail = getContactEmail();
        if (mail) window.location.href = 'mailto:' + mail;
      });

      const copyBtn = document.getElementById('mailCopyBtn');
      if (copyBtn) copyBtn.addEventListener('click', function () {
        const mail = getContactEmail();
        if (!mail) return;
        copyText(mail, function () {
          copyBtn.textContent = '已复制 \u2713';
          setTimeout(function () { copyBtn.textContent = '复制邮箱地址'; }, 1600);
        });
      });
    })();

    async function resolveExternal(value, fallback) {
      if (Array.isArray(value) || (value && typeof value === 'object')) return value;
      if (typeof value === 'string' && value.trim()) {
        try {
          const res = await fetch(value.trim() + '?t=' + Date.now() + '&r=' + Math.random(), { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return await res.json();
        } catch (e) {
          console.warn('外部资源加载失败:', value, e);
          return fallback;
        }
      }
      return fallback;
    }

    document.addEventListener('click', function (e) {
      const copyBtn = e.target.closest('.copy-btn');
      if (!copyBtn) return;
      e.preventDefault();
      e.stopPropagation();
      const url = copyBtn.getAttribute('data-url');
      if (!url) return;
      const done = () => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✅ 已复制';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.classList.remove('copied');
        }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done).catch(fb);
      } else {
        fb();
      }
      function fb() {
        const input = document.createElement('input');
        input.value = url;
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.focus();
        input.select();
        try { document.execCommand('copy'); } catch (_) {}
        document.body.removeChild(input);
        done();
      }
    });

    function getTopItem(rotateItems) {
      if (!rotateItems || !rotateItems.length) return null;
      if (rotateItems.length === 1) return rotateItems[0];
      const range = ROTATE_CFG.randomRange || 10000;
      return rotateItems[Math.abs(Math.floor(Math.sin(topSeed) * range)) % rotateItems.length];
    }
    function formatDateToChinese(d) {
      if (!d || d.length !== 8) return '----';
      return d.slice(0, 4) + '年' + d.slice(4, 6) + '月' + d.slice(6, 8) + '日';
    }
    function isRecent(d) {
      if (!d || d.length !== 8) return false;
      const y = parseInt(d.slice(0, 4)), m = parseInt(d.slice(4, 6)) - 1, day = parseInt(d.slice(6, 8));
      return (Date.now() - new Date(y, m, day).getTime()) / 86400000 <= RECENT_DAYS;
    }
    function getInitials(name) { return name ? name.slice(0, 1).toUpperCase() : '?'; }

    async function fetchJSON(path) {
      const res = await fetch(path + '?t=' + Date.now() + '&r=' + Math.random(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    async function loadConfig() {
      if (SITE_CONFIG) return SITE_CONFIG;
      const res = await fetch('config.json?t=' + Date.now() + '&r=' + Math.random(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      SITE_CONFIG = await res.json();

      const site = SITE_CONFIG.site || {};
      if (site.logo) headerLogo.src = site.logo;
      headerTitle.textContent = site.title || '海量接口搬运备份';

      headerSubtitle.innerHTML = `
        ${site.subtitle || '备用数据源，防屏不迷路'}<br>
        <a class="qq-link" href="${site.qqUrl || '#'}" target="_blank" rel="noopener noreferrer">
          ${site.qqText || '猛戳这里加入QQ群: '}<span style="color:#00C853;">${site.qqHighlight || '点击'}</span>
        </a>
      `;

      if (site.footer) footerText.textContent = site.footer;

      API_DOMAINS = Array.isArray(SITE_CONFIG.apiDomains) ? SITE_CONFIG.apiDomains : [];
      LIVE_DOMAINS = Array.isArray(SITE_CONFIG.liveDomains) ? SITE_CONFIG.liveDomains : [];
      API_WEIGHTS = SITE_CONFIG.apiWeights || {};
      ROTATE_CFG = SITE_CONFIG.rotate || { keywords: [], seed: 'time-random', randomRange: 10000 };
      ROTATE_KEYWORDS = Array.isArray(ROTATE_CFG.keywords) ? ROTATE_CFG.keywords : [];
      RECENT_DAYS = (SITE_CONFIG.recent && SITE_CONFIG.recent.days) || 2;

      SEARCH_CFG = Object.assign({
        placeholder: '🔍 搜索...',
        hideOnTabs: [],
        searchableTabs: ['api', 'live'],
        searchableTabsFull: ['api', 'live', 'download', 'video', 'contributors'],
        selectors: {
          api: '#api-panel .api-item',
          live: '#live-panel .live-item',
          download: '.download-card',
          video: '#video-panel .online-item, #video-panel .tool-chip',
          contributors: '.contributor-card'
        }
      }, SITE_CONFIG.search || {});
      searchBox.placeholder = SEARCH_CFG.placeholder;

      TABS = Array.isArray(SITE_CONFIG.tabs) ? SITE_CONFIG.tabs : [];
      VALID_TABS = TABS.map(t => t.id);

      DOWNLOAD_SOURCES = Array.isArray(SITE_CONFIG.downloadSources) ? SITE_CONFIG.downloadSources : [];

      CUSTOM_APIS = await resolveExternal(SITE_CONFIG.customApis, []);

      const agg = SITE_CONFIG.liveAggregate || {};
      const aggTitle = document.getElementById('liveAggTitle');
      const aggUrl = document.getElementById('liveAggUrl');
      const aggCopy = document.getElementById('liveAggCopy');
      if (aggTitle) aggTitle.textContent = agg.title || '';
      if (aggUrl) aggUrl.textContent = agg.url || '';
      if (aggCopy) aggCopy.setAttribute('data-url', agg.url || '');

      const about = SITE_CONFIG.about || {};
      const domainsData = await resolveExternal(about.domains, []);

      renderContributors(about.contributors || []);
      renderAboutDomains(domainsData);
      renderAboutText(about);

      currentTabId = VALID_TABS.includes(localStorage.getItem(TAB_KEY))
        ? localStorage.getItem(TAB_KEY)
        : (TABS[0] ? TABS[0].id : 'api');

      renderTabs();
      positionSearchBox();
      return SITE_CONFIG;
    }

    function renderAboutDomains(domains) {
      const box = document.getElementById('about-domains-list');
      if (!box) return;

      if (!Array.isArray(domains) || !domains.length) {
        box.innerHTML = '<div class="error-msg">暂无域名</div>';
        return;
      }

      let groups;
      if (typeof domains[0] === 'string') {
        groups = [{ name: '默认线路', icon: '', desc: '域名互为备份', domains }];
      } else {
        groups = domains;
      }

      box.innerHTML = groups.map(g => {
        const name = g.name || '未命名站点';
        const desc = g.desc || '';
        const list = Array.isArray(g.domains) ? g.domains.filter(Boolean) : [];

        const avatarHtml = isImageIcon(g.icon)
          ? `<div class="domain-group-avatar"><img src="${g.icon}" alt="${name}" loading="lazy"
                onerror="this.style.display='none';this.parentNode.textContent='${getInitials(name)}';"></div>`
          : `<div class="domain-group-avatar">${(g.icon && String(g.icon).trim()) || getInitials(name)}</div>`;

        const domainHtml = list.length
          ? list.map(d => `
            <div class="domain-line">
              <span class="url-text">${d}</span>
              <button class="copy-btn" data-url="${d}">复制</button>

          : '<div class="domain-empty">该站点暂未提供域名</div>';

        return `
          <div class="domain-group-card" data-name="${name.toLowerCase()}">
            <div class="domain-group-head">
              ${avatarHtml}
              <div class="domain-group-info">
                <div class="domain-group-name" title="${name}">${name}</div>
                ${desc ? `<div class="domain-group-desc">${desc}</div>` : ''}
              </div>
            </div>
            <div>${domainHtml}</div>
          </div>`;

    function renderAboutText(about) {
      const dec  = document.getElementById('about-declaration');
      const note = document.getElementById('contributors-note');

      if (dec && about.declaration) dec.textContent = about.declaration;
      if (note && about.contributorsNote) note.textContent = about.contributorsNote;

      renderQuickLinks(about.quickLinks || []);
    }

    function renderContributors(list) {
      const c = document.getElementById('contributors-list');
      if (!c) return;
      if (!Array.isArray(list) || !list.length) {
        c.innerHTML = '<div class="error-msg">暂无合作共创人员</div>';
        return;
      }
      c.innerHTML = list.map(x => {
        const avatarHtml = isImageIcon(x.avatar)
          ? `<div class="contributor-avatar"><img src="${x.avatar}" alt="${x.name}" loading="lazy"
                onerror="this.style.display='none';this.parentNode.textContent='${getInitials(x.name)}';"></div>`
          : `<div class="contributor-avatar">${(x.avatar && String(x.avatar).trim()) || getInitials(x.name)}</div>`;

        return `
        <div class="contributor-card" data-name="${(x.name || '').toLowerCase()}">
          <div class="contributor-inner-card">
            ${avatarHtml}
            <div class="contributor-info">
              <div class="contributor-name" title="${x.name}">${x.name}</div>
              ${x.role ? `<div class="contributor-role">${x.role}</div>` : ''}
              ${x.desc ? `<div class="contributor-desc">${x.desc}</div>` : ''}
              ${x.social ? `<div class="contributor-social">${x.social}</div>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');

    function renderOnlineItem(item) {
      const name = item.name || '';
      const url  = item.url || '#';
      const desc = item.desc || '';
      const ph   = name.charAt(0) || '?';

      let iconHtml;
      if (item.icon && String(item.icon).trim()) {
        if (isImageIcon(item.icon)) {
          iconHtml = `<img src="${item.icon}" alt="${name}" loading="lazy"
            onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='flex';">
            <span class="site-ph" style="display:none">${ph}</span>`;
        } else {
          iconHtml = `<span class="site-ph" style="display:flex;font-size:1.4rem">${item.icon}</span>`;
        }
      } else {
        iconHtml = `<span class="site-ph" style="display:flex">${ph}</span>`;
      }

      return `<a class="online-item" href="${url}" target="_blank" rel="noopener noreferrer" data-name="${name.toLowerCase()}">
        <span class="online-item-icon">${iconHtml}</span>
        <div class="online-item-info">
          <div class="online-item-name">${name}</div>
          <div class="online-item-desc">${desc}</div>
        </div>
      </a>`;
    }

    function renderToolChip(item) {
      const name = item.name || '';
      const url  = item.url || '#';
      const desc = item.desc || '';
      const iconHtml = renderIcon(item.icon, { size: '.9rem', box: '1.1rem', fallback: '🔗' });
      return `<a class="tool-chip" href="${url}" target="_blank" rel="noopener noreferrer" title="${desc}" data-name="${name.toLowerCase()}">
        ${iconHtml}<span>${name}</span>
      </a>`;
    }

    function renderApiItemCard(item) {
      const badge = item.badge || item.count || '';
      const note  = item.note  || item.desc  || '';
      let noteHtml = note ? `<div style="font-size:.68rem;color:#8b9eb0;margin-top:6px">${note}</div>` : '';
      return `<div class="api-item" data-name="${(item.name || '').toLowerCase()}">
        <div class="api-item-header">
          <div class="api-item-name" title="${item.name}">${item.name}</div>
          <div class="api-item-meta"><span class="badge-new">${badge}</span></div>
        </div>
        ${noteHtml}
        <div class="api-item-urls">
          <div class="url-line">
            <span class="url-tag">${item.tag || '导入'}</span>
            <span class="url-text">${item.url}</span>
            <button class="copy-btn" data-url="${item.url}">复制</button>
          </div>
        </div>
      </div>`;
    }

    function renderItemsByType(type, items) {
      const list = Array.isArray(items) ? items : [];
      switch (type) {
        case 'online':
          return `<div class="online-list">${list.map(renderOnlineItem).join('\n')}</div>`;
        case 'tools':
          return `<div class="tools-grid">${list.map(renderToolChip).join('\n')}</div>`;
        case 'api':
        default:
          return `<div class="api-list">${list.map(renderApiItemCard).join('\n')}</div>`;
      }
    }

    function renderPanelCard(title, description, type, items) {
      return `<div style="background:#f8fafc;border-radius:12px;padding:14px 16px;border:1px solid #eef2f7">
        <h3 style="font-size:.92rem;font-weight:600;color:#0b1e33;margin-bottom:4px">${title}</h3>
        <p style="font-size:.76rem;color:#5a6f88;margin-bottom:4px">${description}</p>
        ${renderItemsByType(type, items)}
      </div>`;
    }

    async function renderVideo() {
      const container = document.getElementById('video-content');
      if (!container) return;
      let cfg;
      try { cfg = await loadConfig(); } catch (err) {
        container.innerHTML = `<div class="error-msg">❌ 配置加载失败：${err.message || err}</div>`;
        return;
      }
      const tabs = cfg.videoTabs || [];
      if (!tabs.length) { container.innerHTML = `<div class="error-msg">⚠️ 未配置 videoTabs</div>`; return; }

      const dataMap = {};
      await Promise.all(tabs.map(async t => {
        try { dataMap[t.id] = await fetchJSON(t.file); }
        catch (e) { dataMap[t.id] = { title: t.label, description: '加载失败：' + e.message, items: [] }; }
      }));

      const pinnedTabs = tabs.filter(t => t.pinned);
      const normalTabs = tabs.filter(t => !t.pinned);
      const orderedTabs = pinnedTabs.concat(normalTabs);

      const sidebarHtml = orderedTabs.map((t, i) => {
        const isPinned = !!t.pinned;
        const needDivider = isPinned && i === pinnedTabs.length - 1 && normalTabs.length > 0;
        const iconHtml = renderIcon(t.icon, { size: '1.15rem', box: '1.4rem', fallback: '📌' });
        const btn = `<button class="vd-side-btn${isPinned ? ' vd-pinned' : ''}${i === 0 ? ' active' : ''}" data-vd-tab="${t.id}">
          ${iconHtml}<span>${t.label}</span>
        </button>`;
        return btn + (needDivider ? '<div class="vd-side-divider"></div>' : '');
      }).join('\n');

      const bodyHtml = orderedTabs.map((t, i) => {
        const data = dataMap[t.id] || {};
        const type = t.type || 'api';
        const inner = renderPanelCard(data.title || t.label, data.description || '', type, data.items || []);
        return `<div class="vd-group${i === 0 ? ' active' : ''}" id="vd-${t.id}">${inner}</div>`;
      }).join('\n');

      container.className = 'has-sidebar';
      container.innerHTML = `
        <div class="vd-sidebar" id="vdSidebar">${sidebarHtml}</div>
        <div class="vd-body" id="vdBody">${bodyHtml}</div>`;

      document.querySelectorAll('#vdSidebar .vd-side-btn').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelectorAll('#vdSidebar .vd-side-btn').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          const tab = b.getAttribute('data-vd-tab');
          document.querySelectorAll('.vd-group').forEach(g => g.classList.remove('active'));
          const target = document.getElementById('vd-' + tab);
          if (target) target.classList.add('active');
        });
      });
    }

      container.className = 'has-sidebar';
      container.innerHTML = `<div class="loading">⏳ 正在加载更多资源...</div>`;

      try { cfg = await loadConfig(); } catch (err) {
        container.innerHTML = `<div class="error-msg">❌ 配置加载失败：${err.message || err}</div>`;

      await Promise.all(tabs.map(async t => {
        try { dataMap[t.id] = await fetchJSON(t.file); }
        catch (e) { dataMap[t.id] = { title: t.label, description: '加载失败：' + e.message, items: [] }; }

        const iconHtml = renderIcon(t.icon, { size: '1.15rem', box: '1.4rem', fallback: '📌' });

    async function fetchListText() {
      if (rawListText !== null) return rawListText;
      const file = (SITE_CONFIG && SITE_CONFIG.sourceFiles && SITE_CONFIG.sourceFiles.list) || 'list.txt';
      const res = await fetch(file + '?t=' + Date.now() + '&r=' + Math.random(), {
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache' }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      rawListText = await res.text();
      return rawListText;
    }
    function parseItems(text) {
      if (!text || !text.trim()) return [];
      return text.trim().split('\n').filter(l => l.trim()).map(line => {
        const p = line.split('|').map(s => s.trim());
        if (!p[0]) return null;
        return {
          file: p[0],
          name: p[0].replace(/\.json$/i, ''),
          date: p[1] || '',
          size: p[2] || '',
          origUrl: p[3] || '',
          weight: API_WEIGHTS.hasOwnProperty(p[0]) ? API_WEIGHTS[p[0]] : 999
        };
      }).filter(Boolean);
    }
    function parseCustomApis() {
      return CUSTOM_APIS.map(c => {
        if (!c || !c.name) return null;
        const urls = Array.isArray(c.urls) ? c.urls.filter(u => u && u.label && u.url) : [];
        return {
          file: c.name + '.json',
          name: c.name,
          date: c.date || '',
          size: c.size || '',
          origUrl: c.origUrl || '',
          customUrls: urls,
          weight: 999
        };
      }).filter(Boolean);
    }
    function renderUrlLine(tag, url) {
      if (!tag || !url) return '';
      return `<div class="url-line"><span class="url-tag">${tag}</span><span class="url-text">${url}</span><button class="copy-btn" data-url="${url}">复制</button></div>`;
    }
    async function renderApi() {
      const container = document.getElementById('listContainer');
      try {
        try { await loadConfig(); } catch (_) {}
        const text = await fetchListText();
        const tip = document.getElementById('apiLoading');
        if (tip) tip.style.display = 'none';

        let items = parseItems(text).concat(parseCustomApis());
        if (!items.length) { container.innerHTML = '<div class="error-msg">⚠️ 接口列表为空</div>'; return; }

        const ri = items.filter(i => ROTATE_KEYWORDS.some(kw => i.name.toLowerCase().includes(kw.toLowerCase())));
        const top = getTopItem(ri);
        if (top) top.weight = Number.MIN_SAFE_INTEGER;
        items.sort((a, b) => a.weight - b.weight);

        let html = '';
        items.forEach(it => {
          const isNew = isRecent(it.date);
          let lines = '';
          if (it.origUrl) lines += renderUrlLine('原始线路', it.origUrl);
          if (it.customUrls && it.customUrls.length) {
            it.customUrls.forEach(u => { lines += renderUrlLine(u.label, u.url); });
          } else {
            API_DOMAINS.forEach(d => { lines += renderUrlLine(d.tag, d.base + it.name + '.json'); });
          }
          const dateHtml = it.date ? `<span class="${isNew ? 'badge-new' : 'badge-old'}">备份时间 ${formatDateToChinese(it.date)}</span>` : '';
          const sizeHtml = it.size ? `&nbsp;&nbsp;${it.size}` : '';
          const metaHtml = (dateHtml || sizeHtml) ? `<div class="api-item-meta">${dateHtml}${sizeHtml}</div>` : '';
          html += `<div class="api-item" data-name="${it.name.toLowerCase()}">
            <div class="api-item-header">
              <div class="api-item-name" title="${it.name}">${it.name}</div>
              ${metaHtml}
            </div>
            <div class="api-item-urls">${lines}</div>
          </div>`;
        });
        container.innerHTML = html;
      } catch (err) {
        const tip = document.getElementById('apiLoading');
        if (tip) tip.style.display = 'none';
        container.innerHTML = `<div class="error-msg">❌ 接口加载失败：${err.message || err}</div>`;
      }
    }

    async function fetchLiveText() {
      if (rawLiveText !== null) return rawLiveText;
      const file = (SITE_CONFIG && SITE_CONFIG.sourceFiles && SITE_CONFIG.sourceFiles.live) || 'livelist.txt';
      const res = await fetch(file + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      rawLiveText = await res.text();
      return rawLiveText;
    }
    function parseLiveItems(text) {
      if (!text || !text.trim()) return [];
      return text.trim().split('\n').filter(l => l.trim()).map(line => {
        const p = line.split('|').map(s => s.trim());
        if (!p[0]) return null;
        return {
          name: p[0] || '',
          displayName: p[0].replace(/\.[^.]+$/, ''),
          date: p[1] || '',
          size: p[2] || '',
          origUrl: p[3] || '',
          source: p[4] || '',
          ua: p[5] || ''
        };
      }).filter(Boolean);
    }
    function renderLiveList() {
      const container = document.getElementById('liveListContainer');
      const loading = document.getElementById('liveLoading');
      fetchLiveText().then(text => {
        if (loading) loading.style.display = 'none';
        const items = parseLiveItems(text);
        if (!items.length) { container.innerHTML = '<div class="error-msg">⚠️ 直播列表为空</div>'; return; }
        let html = '';
        items.forEach(it => {
          const isNew = isRecent(it.date);
          let urls = '';
          if (it.origUrl) urls += `<div class="live-url-line"><div class="live-info-inline"><span>来源：${it.source || '未知'}</span>${it.ua ? '<span class="sep">|</span><span>UA：' + it.ua + '</span>' : ''}</div><div class="live-url-body"><span class="live-url-tag">原始线路</span><span class="live-url-text">${it.origUrl}</span><button class="copy-btn" data-url="${it.origUrl}">复制</button></div></div>`;
          LIVE_DOMAINS.forEach(d => {
            const u = d.base + it.name;
            urls += `<div class="live-url-line"><div class="live-url-body"><span class="live-url-tag">${d.tag}</span><span class="live-url-text">${u}</span><button class="copy-btn" data-url="${u}">复制</button></div></div>`;
          });
          html += `<div class="live-item" data-name="${it.displayName.toLowerCase()}">
            <div class="live-item-header">
              <div class="live-item-name" title="${it.displayName}">${it.displayName}</div>
              <div class="live-item-meta">
                <span class="${isNew ? 'live-badge-new' : 'live-badge-old'}">备份时间 ${formatDateToChinese(it.date)}</span>${it.size ? '&nbsp;&nbsp;' + it.size : ''}
              </div>
            </div>
            <div class="live-item-urls">${urls}</div>
          </div>`;
        });
        container.innerHTML = html;
      }).catch(err => {
        if (loading) loading.style.display = 'none';
        container.innerHTML = `<div class="error-msg">❌ 直播加载失败：${err.message || err}</div>`;
      });
    }

    let dlCache = new Map();
    let dlCurrentGroup = null;

    async function renderDownloads(force) {
      const container = document.getElementById('downloads-content');
      if (!container || (container.dataset.rendered && !force)) return;
      if (!DOWNLOAD_SOURCES.length) { container.innerHTML = '<div class="error-msg">⚠️ 未配置下载源</div>'; return; }

      if (!container.dataset.rendered) {
        container.dataset.rendered = 'true';
        container.className = 'has-sidebar';
        container.innerHTML = `
          <div class="dl-sidebar" id="dlSidebar"></div>
          <div class="dl-body" id="dlBody"><div class="loading">⏳ 正在加载下载资源...</div></div>`;
      }

      const sidebar = document.getElementById('dlSidebar');
      if (!sidebar.dataset.built) {
        sidebar.dataset.built = 'true';
        sidebar.innerHTML = DOWNLOAD_SOURCES.map((src, idx) => {
          const iconHtml = renderIcon(src.icon, { size: '1.15rem', box: '1.4rem', fallback: '📦' });
          return `<button class="dl-side-btn ${idx === 0 ? 'active' : ''}" data-key="${src.url}">${iconHtml}<span>${src.name || ('组' + (idx + 1))}</span></button>`;
        }).join('');
        sidebar.querySelectorAll('.dl-side-btn').forEach(b => {
          b.addEventListener('click', () => {
            sidebar.querySelectorAll('.dl-side-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            showDownloadGroup(b.getAttribute('data-key'));
          });
        });
      }

      await Promise.all(DOWNLOAD_SOURCES.map(async src => {
        if (dlCache.has(src.url)) return;
        try {
          const res = await fetch(src.url + '?t=' + Date.now() + '&r=' + Math.random(), { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const raw = await res.text();
          const cleaned = raw.replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'").replace(/：/g, ':').replace(/，/g, ',');
          const data = JSON.parse(cleaned);
          let groups = [];
          const arr = data.list || data;
          if (Array.isArray(arr)) {
            arr.forEach(group => {
              if (group && Array.isArray(group.list)) {
                groups.push({ name: group.name || '', list: group.list });
              } else if (group) {
                groups.push({ name: '', list: [group] });
              }
            });
          }
          dlCache.set(src.url, { src, groups });
        } catch (e) {
          dlCache.set(src.url, { src, groups: [], error: e.message });
        }
      }));

      const firstKey = DOWNLOAD_SOURCES[0].url;
      showDownloadGroup(dlCurrentGroup || firstKey);
    }

    function showDownloadGroup(key) {
      dlCurrentGroup = key;
      const body = document.getElementById('dlBody');
      if (!body) return;
      const entry = dlCache.get(key);
      if (!entry) { body.innerHTML = '<div class="loading">⏳ 加载中...</div>'; return; }
      const { src, groups, error } = entry;
      if (error) { body.innerHTML = `<div class="error-msg">❌ ${src.name} 加载失败：${error}</div>`; return; }

      const total = (groups || []).reduce((n, g) => n + ((g.list || []).length), 0);
      if (!total) { body.innerHTML = `<div class="error-msg">⚠️ ${src.name} 暂无资源</div>`; return; }

      const title = src.name ? `<div class="dl-group-title">${src.name}</div>` : '';
      const desc = src.description ? `<div class="dl-group-desc">${src.description}</div>` : '';

      const groupsHtml = (groups || []).map(g => {
        const list = g.list || [];
        if (!list.length) return '';
        const cardsHtml = list.map(i => {
          const ph = (i.name || '?').slice(0, 1).toUpperCase();
          let iconInner = '';
          if (isImageIcon(i.icon)) {
            iconInner = `<img src="${i.icon}" alt="${i.name}" loading="lazy" onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='flex';"><span class="site-ph" style="display:none">${ph}</span>`;
          } else if (i.icon && String(i.icon).trim()) {
            iconInner = `<span class="site-ph" style="display:flex;font-size:1.4rem">${i.icon}</span>`;
          } else {
            iconInner = `<span class="site-ph" style="display:flex">${ph}</span>`;
          }
          return `
            <a class="download-card" href="${i.url || '#'}" target="_blank" rel="noopener noreferrer" data-name="${(i.name || '').toLowerCase()}">
              <span class="dl-item-icon">${iconInner}</span>
              <span class="dl-item-info">
                <span class="dl-item-name">${i.name || ''}</span>
                ${i.version ? `<span class="dl-item-desc">${i.version}</span>` : ''}
              </span>
              <span class="dl-item-btn">⬇ 下载</span>
            </a>`;
        }).join('');
        const gTitle = g.name ? `<div class="dl-subgroup-title">${g.name}</div>` : '';
        return `<div class="dl-subgroup">${gTitle}<div class="dl-cards">${cardsHtml}</div></div>`;
      }).join('');

      body.innerHTML = `<div class="dl-group active">${title}${desc}${groupsHtml}</div>`;
    }

    function renderTabs() {
      if (!TABS.length) return;
      navTabs.innerHTML = TABS.map(t =>
        `<button class="nav-tab ${t.id === currentTabId ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
      ).join('');
      navTabs.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', function () {
          navTabs.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentTabId = this.getAttribute('data-tab');
          localStorage.setItem(TAB_KEY, currentTabId);
          showPanel(currentTabId);
        });
      });
    }

    function showPanel(tabId) {
      if (searchBox) {
        searchBox.value = '';
        document.querySelectorAll('.api-item.hidden, .live-item.hidden, .download-card.hidden, .contributor-card.hidden')
          .forEach(e => e.classList.remove('hidden'));
      }
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      const panel = document.getElementById(tabId + '-panel');
      if (panel) panel.classList.add('active');

      if (searchBox) {
        const hide = SEARCH_CFG.hideOnTabs || [];
        searchBox.style.display = hide.includes(tabId) ? 'none' : '';
      }

      if (tabId === 'api') { topSeed = Date.now() + Math.random(); renderApi(); }
      if (tabId === 'live') renderLiveList();
      if (tabId === 'download') renderDownloads();
      if (tabId === 'video') renderVideo();
      if (tabId === 'more') renderMore();
    }

    function globalSearch() {
      const kw = (searchBox.value || '').toLowerCase().trim();
      const list = (currentMode === 'simple')
        ? (SEARCH_CFG.searchableTabs || [])
        : (SEARCH_CFG.searchableTabsFull || []);
      list.forEach(key => {
        const sel = (SEARCH_CFG.selectors || {})[key];
        if (!sel) return;
        document.querySelectorAll(sel).forEach(el => {
          const n = el.getAttribute('data-name') || '';
          el.classList.toggle('hidden', !n.includes(kw));
        });
      });
    }

    function positionSearchBox() {
      if (currentMode === 'simple') {
        if (searchBox.parentNode !== mainCard.parentNode) mainCard.parentNode.insertBefore(searchBox, mainCard);
      } else {
        if (searchBox.parentNode !== mainCard) navTabs.insertAdjacentElement('afterend', searchBox);
      }
    }
    function updateBtnText() {
      btn.innerHTML = currentMode === 'simple' ? '切换<br>全能版' : '切换<br>简洁版';
    }

    btn.addEventListener('click', () => {
      topSeed = Date.now() + Math.random();
      currentMode = currentMode === 'simple' ? 'full' : 'simple';
      localStorage.setItem(MODE_KEY, currentMode);
      document.body.className = currentMode + '-mode';
      updateBtnText();
      if (currentMode !== 'simple') {
        positionSearchBox();
        renderTabs();
        showPanel(currentTabId);
      } else {
        currentTabId = 'api';
        localStorage.setItem(TAB_KEY, 'api');
        searchBox.style.display = '';
        positionSearchBox();
        renderApi();
      }
    });

    (async function init() {
      try {
        await loadConfig();
      } catch (e) {
        document.getElementById('listContainer').innerHTML =
          `<div class="error-msg">❌ config.json 加载失败：${e.message || e}</div>`;
        return;
      }

      if (currentMode === 'simple') {
        currentTabId = 'api';
        localStorage.setItem(TAB_KEY, 'api');
        renderApi();
      } else {
        showPanel(currentTabId);
      }
    })();
  </script>
</body>
</html>
