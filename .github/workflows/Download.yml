name: Unzip 下载解压到根目录

on:
  workflow_dispatch: # 手动在 Actions 页面触发

permissions:
  contents: write # 允许 workflow 往仓库写文件

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download archive
        run: |
          curl -L -A "Mozilla/5.0 (compatible; github-actions)" \
            "https://mpimg.cn/down.php/494ab619d7d9e674a54d4a3ddfd538b6.zip" \
            -o archive.zip

      - name: Inspect & unzip to repo root
        run: |
          file archive.zip || true
          # -o 覆盖已有文件；解压到当前目录（即仓库根目录）
          unzip -o archive.zip -d .
          rm -f archive.zip

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No file changes, skip commit."
          else
            git commit -m "chore: extract remote zip into repo root"
            git push origin HEAD:${{ github.ref_name }}
          fi
